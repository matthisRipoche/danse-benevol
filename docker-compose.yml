services:
    mariadb:
        image: mariadb:10.11
        container_name: danse-benevol-mariadb
        restart: unless-stopped
        environment:
            MARIADB_DATABASE: danse_benevol
            MARIADB_USER: danse_benevol
            MARIADB_PASSWORD: danse_benevol
            MARIADB_ROOT_PASSWORD: root
        ports:
            - "3307:3306"
        volumes:
            - danse-benevol-mariadb-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 5s
            timeout: 5s
            retries: 10

    phpmyadmin:
        image: phpmyadmin:latest
        container_name: danse-benevol-phpmyadmin
        restart: unless-stopped
        environment:
            PMA_HOST: mariadb
            PMA_PORT: 3306
            PMA_USER: danse_benevol
            PMA_PASSWORD: danse_benevol
        ports:
            - "8081:80"
        depends_on:
            mariadb:
                condition: service_healthy

volumes:
    danse-benevol-mariadb-data:
