services:
    mysql:
        image: mysql:8.0
        container_name: danse-benevol-mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: danse_benevol
            MYSQL_USER: danse_benevol
            MYSQL_PASSWORD: danse_benevol
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "3307:3306"
        volumes:
            - danse-benevol-mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
            interval: 5s
            timeout: 5s
            retries: 10

    phpmyadmin:
        image: phpmyadmin:latest
        container_name: danse-benevol-phpmyadmin
        restart: unless-stopped
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
            PMA_USER: danse_benevol
            PMA_PASSWORD: danse_benevol
        ports:
            - "8081:80"
        depends_on:
            mysql:
                condition: service_healthy

volumes:
    danse-benevol-mysql-data:
