; Réglages de production de l'application (chargés après php.ini-production)

expose_php = Off
memory_limit = 256M

; Photo de badge limitée à 5 Mo par la validation Laravel
upload_max_filesize = 6M
post_max_size = 8M

; Le code ne change pas dans un conteneur : inutile de revérifier les fichiers
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
