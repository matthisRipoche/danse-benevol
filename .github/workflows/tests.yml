name: Tests

on:
    pull_request:
    workflow_call:

permissions:
    contents: read

jobs:
    tests:
        name: Style et tests
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: intl, zip, bcmath, pdo_sqlite
                  coverage: none

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Dépendances
              run: |
                  composer install --no-interaction --prefer-dist --no-progress
                  npm ci

            - name: Build des assets
              run: npm run build

            - name: Style (Pint)
              run: vendor/bin/pint --test

            - name: Tests
              run: |
                  cp .env.example .env
                  php artisan key:generate
                  php artisan test --compact
